<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">Felipe M. Souza — Fullstack Developer</title>
  <desc id="desc">Bots, automações, SaaS e apps, do backend ao mobile. Brasil, Ciência da Computação.</desc>
  <defs>
    <clipPath id="frame"><rect width="1280" height="440" rx="24"/></clipPath>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F1F5F9"/>
      <stop offset="0.55" stop-color="#C7D2FE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0.7"/>
      <stop offset="0.45" stop-color="#f0f6fc" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="g-indigo"><stop offset="0" stop-color="#6366F1" stop-opacity="0.32"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-cyan"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.18"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f0f6fc" stroke-opacity="0.05"/></pattern>
    <radialGradient id="fade" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="grid-mask"><rect width="1280" height="440" fill="url(#fade)"/></mask>
    <style>
      .sans { font-family: "Segoe UI", Inter, -apple-system, Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, Menlo, monospace; }
      .code { font-size: 16px; fill: #e2e8f0; }
      .k { fill: #f472b6; } .p { fill: #7dd3fc; } .s { fill: #a5f3fc; } .n { fill: #94a3b8; } .c { fill: #64748b; font-style: italic; }
      .float-1 { animation: float 6s ease-in-out infinite; }
      .float-2 { animation: float 6s ease-in-out -2s infinite; }
      .float-3 { animation: float 6s ease-in-out -4s infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .cursor { animation: blink 1.1s steps(2, start) infinite; }
      .shine { animation: shine 6s ease-in-out infinite; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @keyframes blink { to { visibility: hidden; } }
      @keyframes shine { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="440" fill="#0b0d12"/>
    <rect width="1280" height="440" fill="url(#grid)" mask="url(#grid-mask)"/>
    <circle cx="200" cy="40" r="420" fill="url(#g-indigo)"/>
    <circle cx="1100" cy="420" r="380" fill="url(#g-cyan)"/>

    <!-- ===== Texto ===== -->
    <g class="sans">
      <rect x="64" y="70" width="236" height="32" rx="16" fill="#22C55E" fill-opacity="0.1" stroke="#22C55E" stroke-opacity="0.4"/>
      <circle cx="84" cy="86" r="5" fill="#22C55E" class="pulse"/>
      <text x="98" y="91" class="mono" font-size="13" fill="#86EFAC">aberto a colaborações</text>

      <text x="60" y="186" font-size="74" font-weight="700" letter-spacing="-2.5" fill="url(#name)">Felipe M. Souza</text>
      <rect x="64" y="210" width="72" height="4" rx="2" fill="url(#accent)"/>
      <text x="152" y="219" font-size="26" font-weight="600" fill="#e2e8f0">Fullstack Developer</text>

      <text x="64" y="272" font-size="20" fill="#94a3b8">Bots, automações, SaaS e apps —</text>
      <text x="64" y="300" font-size="20" fill="#94a3b8">do backend ao mobile.</text>

      <g class="mono" font-size="13" fill="#64748b">
        <g transform="translate(64 340)" fill="none" stroke="#818CF8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" transform="scale(0.75)"/>
          <circle cx="9" cy="7.5" r="2.2"/>
        </g>
        <text x="88" y="354">Brasil</text>
        <text x="146" y="354" fill="#334155">/</text>
        <g transform="translate(166 340)" fill="none" stroke="#818CF8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z" transform="scale(0.75)"/>
          <path d="M16.5 8.5v3.75a4.5 1.5 0 0 1-9 0V8.5" transform="scale(0.75)" />
        </g>
        <text x="190" y="354">Ciência da Computação</text>
      </g>
    </g>

    <!-- ===== Janela de código ===== -->
    <g>
      <rect x="716" y="84" width="500" height="272" rx="16" fill="#0f131b"/>
      <rect x="716.75" y="84.75" width="498.5" height="270.5" rx="15.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
      <path d="M717 101a16 16 0 0 1 16-16h466a16 16 0 0 1 16 16v23H717Z" fill="#131823"/>
      <line x1="717" y1="124" x2="1215" y2="124" stroke="#f0f6fc" stroke-opacity="0.07"/>
      <circle cx="738" cy="104" r="5" fill="#ff5f57" fill-opacity="0.75"/>
      <circle cx="754" cy="104" r="5" fill="#febc2e" fill-opacity="0.75"/>
      <circle cx="770" cy="104" r="5" fill="#28c840" fill-opacity="0.75"/>
      <text x="794" y="109" class="mono" font-size="13" fill="#cbd5e1">felipe.ts</text>
      <rect x="790" y="122" width="66" height="2" fill="url(#accent)"/>

      <g class="mono code">
        <text x="740" y="160"><tspan class="k">const</tspan> felipe <tspan class="n">=</tspan> <tspan class="n">{</tspan></text>
        <text x="740" y="188" xml:space="preserve">  <tspan class="p">role</tspan><tspan class="n">:</tspan> <tspan class="s">"Fullstack Developer"</tspan><tspan class="n">,</tspan></text>
        <text x="740" y="216" xml:space="preserve">  <tspan class="p">stack</tspan><tspan class="n">: [</tspan><tspan class="s">"TS"</tspan><tspan class="n">, </tspan><tspan class="s">"Python"</tspan><tspan class="n">, </tspan><tspan class="s">"PHP"</tspan><tspan class="n">],</tspan></text>
        <text x="740" y="244" xml:space="preserve">  <tspan class="p">builds</tspan><tspan class="n">: [</tspan><tspan class="s">"bots"</tspan><tspan class="n">, </tspan><tspan class="s">"SaaS"</tspan><tspan class="n">, </tspan><tspan class="s">"apps"</tspan><tspan class="n">],</tspan></text>
        <text x="740" y="272" xml:space="preserve">  <tspan class="p">focus</tspan><tspan class="n">: [</tspan><tspan class="s">"produto"</tspan><tspan class="n">, </tspan><tspan class="s">"automação"</tspan><tspan class="n">],</tspan></text>
        <text x="740" y="300"><tspan class="n">};</tspan></text>
        <rect x="764" y="286" width="9" height="18" fill="#e2e8f0" fill-opacity="0.7" class="cursor"/>
        <text x="740" y="334" class="c" font-size="14">// código que resolve problema real</text>
      </g>
    </g>

    <!-- ===== Chips flutuantes ===== -->
    <g class="mono" font-size="13">
      <g class="float-1">
        <rect x="1130" y="44" width="118" height="34" rx="10" fill="#131823" stroke="#f0f6fc" stroke-opacity="0.12"/>
        <circle cx="1148" cy="61" r="4.5" fill="#38BDF8"/>
        <text x="1160" y="66" fill="#cbd5e1">Telegram</text>
      </g>
      <g class="float-2">
        <rect x="652" y="300" width="112" height="34" rx="10" fill="#131823" stroke="#f0f6fc" stroke-opacity="0.12"/>
        <circle cx="670" cy="317" r="4.5" fill="#4ADE80"/>
        <text x="682" y="322" fill="#cbd5e1">WhatsApp</text>
      </g>
      <g class="float-3">
        <rect x="1150" y="330" width="96" height="34" rx="10" fill="#131823" stroke="#f0f6fc" stroke-opacity="0.12"/>
        <circle cx="1168" cy="347" r="4.5" fill="#2DD4BF" class="shine"/>
        <text x="1180" y="352" fill="#cbd5e1">PIX</text>
      </g>
      <g class="float-2">
        <rect x="660" y="56" width="88" height="34" rx="10" fill="#131823" stroke="#818CF8" stroke-opacity="0.45"/>
        <text x="704" y="78" text-anchor="middle" fill="#A5B4FC">{ API }</text>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="439" rx="23.5" fill="none" stroke="#f0f6fc" stroke-opacity="0.1"/>
</svg>
