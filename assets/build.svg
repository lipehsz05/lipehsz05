  <title id="t">O que eu construo</title>
  <desc id="d">Bots e automações: Bots para Telegram, WhatsApp e Discord, com painéis de gestão. (Python · Node.js · Telegraf). Pagamentos via PIX: Cobrança com liberação automática de acesso e controle de assinaturas. (Mercado Pago · PushinPay). SaaS e painéis: Sistemas web multi-tenant e painéis administrativos. (Laravel · PHP · MySQL). Aplicações web: Front e back em TypeScript, do banco de dados à interface. (Next.js · Prisma · Tailwind). Apps mobile: Apps para Android e iOS, incluindo projetos white-label. (React Native · Expo · Flutter). IA aplicada: Atendimento e automações com modelos de linguagem via API. (OpenAI API · bots)</desc>
